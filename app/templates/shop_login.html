<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>{{ site_name }} · 登录 / 注册</title>
<link rel="stylesheet" href="/static/style.css?v=20261024i">
<link rel="stylesheet" href="/static/landing.css?v=20261024i">
<link rel="stylesheet" href="/static/shop.css?v=20261030i">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M18 34l9 9 19-22' stroke='%2334e0b0' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="pub lp sh" data-page="login">
<div class="aurora a1"></div><div class="aurora a2"></div>
<div class="grid-bg"></div>

<header class="topbar lp-nav">
  <a class="brand" href="/">
    <span class="logo-mark"></span>
    <span class="brand-name">{{ site_name }}</span>
    <span class="brand-tag">SHOP</span>
  </a>
  <nav class="lp-links">
    <a href="/shop">号码商城</a>
    <a href="/shop/me">个人中心</a>
    <a href="/redeem">卡密入口</a>
  </nav>
  <div class="lp-nav-cta"><a class="btn ghost sm" href="/shop">返回商城</a></div>
</header>

<main class="sh-main">
  <div class="sh-auth">
    <section class="sh-auth-card">
      <div class="sh-tabs">
        <button id="tabLogin" class="on" type="button">登录</button>
        <button id="tabReg" type="button">注册</button>
      </div>

      <div class="sh-buybar">
        <div><b>还没有充值码？</b><span>最低 ¥5 起充，支付后立刻拿到充值码</span></div>
        <a class="btn primary sm" href="{{ rcode_url }}" target="_blank" rel="noopener">去购买充值码</a>
      </div>

      <form id="loginForm" class="sh-form" autocomplete="on">
        <label>账号<input id="lgUser" name="username" type="text" autocomplete="username"
          placeholder="4-20 位字母 / 数字 / 下划线" required></label>
        <label>密码<input id="lgPass" name="password" type="password" autocomplete="current-password"
          placeholder="至少 8 位" required></label>
        <div class="sh-err" id="lgErr"></div>
        <button class="btn primary wide" type="submit" id="lgBtn">登录</button>
      </form>

      <form id="regForm" class="sh-form" autocomplete="on" style="display:none">
        <label>充值码（必填）<a class="lab-link" href="{{ rcode_url }}" target="_blank" rel="noopener">还没有？去购买</a><input id="rgCode" name="code" type="text" autocomplete="off"
          placeholder="SG-XXXX-XXXX-XXXX-XXXX" maxlength="32" required></label>
        <label>账号<input id="rgUser" name="username" type="text" autocomplete="username"
          placeholder="4-20 位字母 / 数字 / 下划线" required></label>
        <label>密码<input id="rgPass" name="password" type="password" autocomplete="new-password"
          placeholder="至少 8 位，不能是纯数字" required></label>
        <label>确认密码<input id="rgPass2" name="password2" type="password" autocomplete="new-password"
          placeholder="再输入一次密码" required></label>
        <div class="sh-err" id="rgErr"></div>
        <button class="btn primary wide" type="submit" id="rgBtn">注册并登录</button>
      </form>

      <p class="sh-tip" id="authTip">
        注册必须填写购买到的充值码：注册成功即自动充值到账号余额，余额用完后账号仍然保留，
        随时可以再充。忘记密码请把账号发给客服，由后台重置。
      </p>
    </section>

    <aside class="sh-auth-side">
      <div class="li"><b>01</b><span>先去购买充值码（最低 ¥5 起充）→ 注册时填写，金额直接进余额；余额永久有效。</span></div>
      <div class="li"><b>02</b><span>在商城选运营商与卡类型，按平台成功率与价格下单。</span></div>
      <div class="li"><b>03</b><span>下单后立即拿到直链卡密：卡号:手机号----接码地址，可反复刷新取码。</span></div>
      <div class="li"><b>04</b><span>购买记录与接码地址都保存在个人中心，换设备也能找回。</span></div>
    </aside>
  </div>
</main>

<div id="toast" class="toast"></div>
<script src="/static/shop.js?v=20261030i"></script>
</body>
</html>
