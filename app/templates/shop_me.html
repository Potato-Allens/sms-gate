<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>{{ site_name }} · 个人中心</title>
<link rel="stylesheet" href="/static/style.css?v=20261024i">
<link rel="stylesheet" href="/static/landing.css?v=20261024i">
<link rel="stylesheet" href="/static/shop.css?v=20261030i">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M18 34l9 9 19-22' stroke='%2334e0b0' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="pub lp sh" data-page="me">
<div class="aurora a1"></div><div class="aurora a2"></div>
<div class="grid-bg"></div>

<header class="topbar lp-nav">
  <a class="brand" href="/">
    <span class="logo-mark"></span>
    <span class="brand-name">{{ site_name }}</span>
    <span class="brand-tag">ACCOUNT</span>
  </a>
  <nav class="lp-links">
    <a href="/shop">号码商城</a>
    <a href="/shop/me">个人中心</a>
    <a href="/redeem">卡密入口</a>
  </nav>
  <div class="lp-nav-cta">
    <span class="chip chip-ok" id="meName">—</span>
    <button class="btn ghost sm" id="btnLogout" type="button">退出</button>
  </div>
</header>

<main class="sh-main">
  <div class="sh-me">
    <div class="sh-me-head">
      <section class="sh-balance">
        <div class="bl">账户余额 · Balance</div>
        <div class="bv"><small>¥</small><span id="balVal">0.00</span></div>
        <div class="bu" id="balNote">充值后即可在商城按平台价格下单</div>
      </section>

      <section class="sh-rcard">
        <h3>充值码充值</h3>
        <p>输入后台发放的充值码（形如 SG-XXXX-XXXX-XXXX-XXXX），一次性核销，充值后余额长期有效。</p>
        <p class="rc-buy">还没有充值码？<a href="{{ rcode_url }}" target="_blank" rel="noopener">去购买 · 最低 ¥5 起充</a></p>
        <form class="sh-rform" id="rcForm" autocomplete="off">
          <input id="rcCode" placeholder="SG-XXXX-XXXX-XXXX-XXXX" maxlength="32" required>
          <button class="btn primary" type="submit" id="rcBtn">充值</button>
        </form>
        <div class="sh-err" id="rcErr"></div>
      </section>
    </div>

    <section class="sh-orders">
      <div class="sh-orders-head">
        <h3>购买记录</h3>
        <span class="hint">直链卡密可长期使用，复制后直接打开即可取码</span>
      </div>
      <div class="sh-tblwrap">
        <table class="sh-tbl">
          <thead><tr>
            <th>时间</th><th>平台</th><th>号码</th><th>金额</th><th>状态</th><th>接码地址</th><th>操作</th>
          </tr></thead>
          <tbody id="orderBody"><tr><td colspan="7" class="mono">加载中…</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="sh-orders">
      <div class="sh-orders-head"><h3>安全设置</h3><span class="hint">修改密码后其它设备会退出登录</span></div>
      <div style="padding:18px 20px 22px">
        <form class="sh-form" id="pwForm" style="max-width:460px">
          <label>原密码<input id="pwOld" type="password" autocomplete="current-password" required></label>
          <label>新密码<input id="pwNew" type="password" autocomplete="new-password"
            placeholder="至少 8 位，不能是纯数字" required></label>
          <div class="sh-err" id="pwErr"></div>
          <button class="btn ghost" type="submit">保存新密码</button>
        </form>
      </div>
    </section>

    <p class="sh-foot">请妥善保管账号与卡密链接 · © {{ year }} {{ site_name }}</p>
  </div>
</main>

<div id="toast" class="toast"></div>
<script src="/static/shop.js?v=20261030j"></script>
</body>
</html>
