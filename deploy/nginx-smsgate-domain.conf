# SMS Gate production HTTPS vhost for 12456.cfd
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 12456.cfd www.12456.cfd;

    if ($host = www.12456.cfd) { return 301 https://12456.cfd$request_uri; }

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    ssl_certificate /etc/letsencrypt/live/12456.cfd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/12456.cfd/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SGSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:8861;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1d;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8861;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1h;
    }

    location /admin/api/ {
        limit_req zone=sg_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8861;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=sg_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8861;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
