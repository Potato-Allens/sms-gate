# SMS Gate HTTP entry: ACME challenge only, everything else 301 to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name 12456.cfd www.12456.cfd;

    server_tokens off;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://12456.cfd$request_uri;
    }
}