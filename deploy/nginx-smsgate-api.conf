# SMS Gate relay API vhost: api.12456.cfd
# 只暴露接码相关路径，其它一律 404，避免把后台/商城暴露在子域上。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.12456.cfd;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 15s;
    keepalive_timeout 30s;

    ssl_certificate /etc/letsencrypt/live/12456.cfd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/12456.cfd/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SGSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location = /smsrecord {
        limit_req zone=sg_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8861;
        proxy_http_version 1.1;
        proxy_set_header Host api.12456.cfd;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
    }

    location = /smsrecord.js {
        proxy_pass http://127.0.0.1:8861;
        proxy_set_header Host api.12456.cfd;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1h;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8861;
        proxy_set_header Host api.12456.cfd;
    }

    location / { return 404; }
}
